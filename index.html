<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Happy Birthday Meghana</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root{
  --bg-gradient: radial-gradient(circle at 12% 18%, #ffe8d6 0%, transparent 40%),
                 radial-gradient(circle at 88% 16%, #ffd7e8 0%, transparent 40%),
                 radial-gradient(circle at 50% 85%, #daf2e0 0%, transparent 50%),
                 radial-gradient(circle at 82% 82%, #ffeed4 0%, transparent 45%),
                 #fef7ee;
  --board:#f4e2c4;
  --board-d:#dfbe86;
  --card:#fffaf1;
  --ink:#4a3427;
  --peach:#ffb58a;
  --peach-d:#e97f47;
  --lav:#d8c2ff;
  --lav-d:#a97ff0;
  --mint:#b2ecd1;
  --mint-d:#6cc79c;
  --yellow:#ffea9f;
  --yellow-d:#f0c256;
  --coral:#ff6f6a;
}
*{box-sizing:border-box}
html,body{
  min-height:100%;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color: transparent;
}
body{
  background: var(--bg-gradient);
  background-attachment: fixed;
  font-family:'Nunito',system-ui, -apple-system, sans-serif;
  color:var(--ink);
  overflow-x:hidden;
}

/* Artistic Watercolor & Canvas Texture */
.texture{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(var(--board-d) 1.2px, transparent 1.2px),
    repeating-linear-gradient(45deg, rgba(223, 190, 134, 0.08) 0px, rgba(223, 190, 134, 0.08) 2px, transparent 2px, transparent 8px);
  background-size:24px 24px, 16px 16px;
  opacity:.45;
}
.sparkle{
  position:fixed; pointer-events:none; font-size:20px; opacity:0;
  text-shadow:0 0 10px #fff8, 0 0 16px #ffd7; z-index:6;
}

/* ================= BACK BUTTON ================= */
.backBtn{
  position:fixed; top:14px; left:14px; z-index:30;
  width:40px; height:40px; border-radius:50%;
  background:#fff; border:3px solid var(--ink);
  display:none; align-items:center; justify-content:center;
  font-size:17px; font-weight:900; cursor:pointer;
  box-shadow:0 4px 0 #0002;
}

/* ================= GATE ================= */
#gate{ transition:opacity .5s ease, visibility .5s ease; }
#gate.hide{ opacity:0; visibility:hidden; position:fixed; inset:0; pointer-events:none; }

.scene{
  position:fixed; inset:0; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:18px; padding:16px;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .45s ease;
}
.scene.active{ opacity:1; visibility:visible; pointer-events:auto; }

/* ---- Neon Intro ---- */
.scene-neon{ background:#1c1815; overflow:hidden; }
.introBg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center 70%;
}
.introScrim{
  position:absolute; inset:0;
  background:linear-gradient(180deg, #000000b0 0%, #00000040 38%, #00000090 100%);
}
.neon-content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:24px; padding:0 12px; }
.neon-text{
  font-family:'Great Vibes', cursive;
  font-size:clamp(26px, 5.2vw, 54px);
  line-height:1.35;
  color:#ffe9b8;
  text-shadow:
    0 0 6px #ffdf9a, 0 0 14px #ffcf6b, 0 0 26px #ffb84d, 0 0 46px #ff9f2e;
  max-width:820px;
}
.neon-heart{
  position:absolute; z-index:2; font-size:22px; color:#ffdb8a;
  text-shadow:0 0 10px #ffcf6b, 0 0 18px #ff9f2e;
  animation:twinkle 1.8s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{ opacity:.35; transform:scale(.9); }
  50%{ opacity:1; transform:scale(1.15); }
}

/* ---- Question Layout with Responsive Media Elements ---- */
.scene-light{ background:transparent; }
.qWrapper{
  display:flex; align-items:center; justify-content:center;
  gap:clamp(12px, 3.5vw, 36px); max-width:1100px; width:100%;
}
.mediaBox{
  width:clamp(85px, 18vw, 200px);
  height:clamp(85px, 18vw, 200px);
  border-radius:20px;
  border:3px solid var(--ink);
  box-shadow:0 8px 0 #0002;
  overflow:hidden;
  flex-shrink:0;
  background:var(--card);
}
.mediaBox img, .mediaBox video{
  width:100%; height:100%; object-fit:cover; display:block;
}
.leftMedia{ transform:rotate(-5deg); }
.rightMedia{ transform:rotate(5deg); }

.qCenter{
  display:flex; flex-direction:column; align-items:center; gap:14px;
  max-width:520px;
}
.scene-light .qTitle{
  font-family:'Baloo 2'; font-weight:800; font-size:clamp(20px, 3.8vw, 36px); color:var(--ink);
  line-height:1.2;
}
.scene-light .qSub{
  font-family:'Caveat'; font-weight:700; font-size:clamp(19px, 3vw, 28px); color:var(--peach-d);
  margin-bottom:-6px;
}

.btnRow{ 
  display:flex; gap:12px; justify-content:center; align-items:center; 
  position:relative; width:100%; min-height:54px;
}

.choiceBtn{
  font-family:'Baloo 2'; font-weight:800; font-size:clamp(15px, 2vw, 18px);
  border:3px solid var(--ink); border-radius:999px;
  padding:10px 24px; cursor:pointer;
  box-shadow:0 6px 0 #0002; transition:transform .12s ease;
  white-space:nowrap;
}
.choiceBtn:active{ transform:translateY(3px); }
.choiceBtn.good{ background:var(--mint); box-shadow:0 6px 0 #0002, inset 0 -4px 0 var(--mint-d); }
.choiceBtn.dodgy{ 
  background:var(--coral); color:#fff; box-shadow:0 6px 0 #0002, inset 0 -4px 0 #c94d47; 
  transition:left .2s cubic-bezier(0.34, 1.56, 0.64, 1), top .2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.nextBtn, .pillBtn{
  font-family:'Baloo 2'; font-weight:800; font-size:clamp(16px, 2.2vw, 19px);
  background:var(--coral); color:#fff;
  border:3px solid var(--ink); border-radius:999px;
  padding:12px 30px; cursor:pointer;
  box-shadow:0 7px 0 #0002, inset 0 -5px 0 #c94d47;
  transition:transform .15s ease;
  display:inline-flex; align-items:center; gap:8px;
}
.nextBtn:active, .pillBtn:active{ transform:translateY(4px); }

/* ---- Scene 4: 4 Corners Birthday Stage ---- */
.stageContainer{
  position:relative;
  width:min(920px, 94vw);
  height:min(580px, 82vh);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.cornerPic{
  position:absolute;
  width:clamp(75px, 14vw, 145px);
  height:clamp(75px, 14vw, 145px);
  border-radius:18px;
  border:3px solid var(--ink);
  background:var(--card);
  box-shadow:0 8px 16px #0002;
  overflow:hidden;
}
.cornerPic img, .cornerPic video{ width:100%; height:100%; object-fit:cover; }
.corner-tl{ top:4px; left:4px; transform:rotate(-8deg); }
.corner-tr{ top:4px; right:4px; transform:rotate(8deg); }
.corner-bl{ bottom:4px; left:4px; transform:rotate(6deg); }
.corner-br{ bottom:4px; right:4px; transform:rotate(-6deg); }

.centerHero{
  display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
  z-index:2;
}
.row { display:flex; gap:4px; align-items:flex-end; justify-content:center; flex-wrap:wrap; }
.tile {
  display:grid; place-items:center; min-width:clamp(38px, 6vw, 48px); padding:4px 8px;
  background:linear-gradient(#fff, #f6f8ff); border:3px solid var(--ink);
  border-radius:12px; box-shadow:0 6px 0 #0002;
  font-size:clamp(26px, 4.8vw, 56px); line-height:1; font-weight:800; color:var(--ink);
  transform:translateY(40px); opacity:0;
}
.coralText {
  display:inline-block; font-size:clamp(26px, 4.8vw, 56px); font-weight:800;
  color:var(--peach-d); -webkit-text-stroke:1.5px var(--ink);
  filter:drop-shadow(0 5px 0 #0002); transform:translateY(40px); opacity:0;
}
.cake {
  display:inline-block; margin-left:.35rem; font-size:clamp(22px, 3.5vw, 38px);
  animation:cakeWiggle 2.2s ease-in-out infinite;
}
@keyframes cakeWiggle {
  0%, 100% { transform: translateY(0) rotate(-6deg); }
  50% { transform: translateY(-4px) rotate(6deg); }
}

.hat {
  position:absolute; width:clamp(26px, 4vw, 48px); height:clamp(26px, 4vw, 48px);
  left:58%; top:-24%; transform-origin:30% 90%; animation:hatSlide 2.6s ease-in-out infinite;
}
@keyframes hatSlide {
  0%, 100% { transform: translateX(-6px) rotate(10deg); }
  50% { transform: translateX(4px) rotate(16deg); }
}

/* ================= 12 MONTHS BOARD ================= */
.boardWrap{ position:relative; z-index:2; min-height:100vh; padding:80px 16px 60px; display:none; }
.boardWrap.show{display:block}

.boardHeader{ text-align:center; margin-bottom:20px; }
.boardHeader h1{ font-family:'Baloo 2'; font-size:clamp(22px, 4.2vw, 42px); margin:0; color:var(--ink); }
.boardSub{ text-align:center; margin-top:2px; }
.boardSub p{ font-family:'Caveat'; font-size:clamp(19px, 3vw, 24px); margin:0; color:var(--peach-d); }

.grid-notes{
  max-width:1180px; margin:0 auto;
  display:grid;
  grid-template-columns: 1fr;
  gap:16px;
}
@media(min-width: 600px){
  .grid-notes{ grid-template-columns: repeat(2, 1fr); gap:18px; }
}
@media(min-width: 960px){
  .grid-notes{ grid-template-columns: repeat(4, 1fr); gap:22px 18px; }
}

/* Interactive Card Styling */
.monthCard{
  position:relative; border-radius:14px; padding:18px 14px;
  border:3px solid var(--ink); box-shadow:0 6px 14px #0002;
  cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  min-height:95px; transition:transform .25s ease, box-shadow .25s ease;
  user-select:none;
}
.monthCard:hover{ transform:translateY(-3px) scale(1.01); }

.monthCard.c1{background:var(--peach)}
.monthCard.c2{background:var(--lav)}
.monthCard.c3{background:var(--mint)}
.monthCard.c4{background:var(--yellow)}

.pin{
  position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  width:14px; height:14px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff, var(--coral) 60%, #a83a35 100%);
  border:1px solid #0003; box-shadow:0 2px 4px #0004;
}

.monthLabel{
  font-family:'Baloo 2'; font-weight:800; font-size:clamp(19px, 2.5vw, 22px); color:var(--ink);
  transition:all .2s ease;
}
.monthSubPrompt{
  font-family:'Caveat'; font-size:16px; color:#4a3427aa; margin-top:2px;
}

/* Revealed Content on Click */
.monthDetails{
  display:none; text-align:center; width:100%;
}
.monthCard.opened{
  min-height:200px;
  box-shadow:0 12px 24px #0003;
  transform:scale(1.02);
  z-index:4;
}
.monthCard.opened .monthSubPrompt{ display:none; }
.monthCard.opened .monthLabel{
  font-size:14px; background:#fff; border:2px solid var(--ink);
  border-radius:999px; padding:2px 12px; margin-bottom:8px;
}
.monthCard.opened .monthDetails{ display:block; animation:fadeIn .3s ease; }

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}

.monthHeading{ font-family:'Baloo 2'; font-weight:800; font-size:17px; margin-bottom:6px; color:var(--ink); line-height:1.2; }
.monthBody{ font-family:'Caveat'; font-weight:700; font-size:19px; line-height:1.4; margin:0; }

/* Floating Letter Button */
.floatBtn{
  position:fixed; top:14px; right:14px; z-index:20;
  font-family:'Baloo 2'; font-weight:800; font-size:clamp(13px, 1.8vw, 15px);
  background:var(--coral); color:#fff;
  border:3px solid var(--ink); border-radius:999px;
  padding:8px 16px; cursor:pointer;
  box-shadow:0 4px 0 #0002, inset 0 -4px 0 #c94d47;
  display:none; align-items:center; gap:6px;
}
body.board-active .floatBtn{display:inline-flex}

/* Modals */
.modalBack{
  position:fixed; inset:0; background:#3a2b2380;
  display:none; align-items:center; justify-content:center; z-index:40; padding:16px;
}
.modalBack.show{display:flex}
.letterCard{
  width:min(640px, 94vw); max-height:86vh; overflow-y:auto;
  background:var(--card); border:4px solid var(--ink); border-radius:18px;
  padding:26px 20px 20px; position:relative; box-shadow:0 18px 36px #0004;
}
.closeX{
  position:absolute; right:10px; top:10px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:2px solid var(--ink); display:grid; place-items:center;
  font-weight:900; cursor:pointer;
}
.letterCard h2{ font-family:'Baloo 2'; text-align:center; margin:0 0 12px; font-size:clamp(20px, 3.5vw, 24px); }
.letterCard p{ font-family:'Caveat'; font-size:clamp(18px, 3vw, 21px); line-height:1.5; white-space:pre-wrap; margin:0; }
.signature{ text-align:right; font-family:'Caveat'; font-size:clamp(20px, 3.5vw, 24px); margin-top:14px; color:var(--peach-d); }
</style>
</head>
<body>

  letterTitle: "To my kuchu puchu Meghana 💖",

/* ===================== SPARKLES ===================== */
const sparkLayer = document.getElementById('sparkLayer');
function spawnSpark(){
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.textContent = CONFIG.sparkleSet[Math.floor(Math.random()*CONFIG.sparkleSet.length)];
  s.style.left = Math.random()*innerWidth + 'px';
  s.style.top = Math.random()*innerHeight + 'px';
  s.style.transform = `scale(${0.6+Math.random()*1.2}) rotate(${Math.random()*30-15}deg)`;
  sparkLayer.appendChild(s);
  requestAnimationFrame(()=> s.style.transition = 'opacity .2s ease');
  s.style.opacity = 1;
  setTimeout(()=> s.style.opacity = 0, 400 + Math.random()*500);
  setTimeout(()=> s.remove(), 1200);
}
for(let i=0;i<3;i++) spawnSpark();
setInterval(spawnSpark, 1000/CONFIG.sparklesPerSecond);

/* ===================== AUDIO ===================== */
const bgm = document.getElementById('bgm');
let musicOn = false;
function tryPlay(){ bgm.play().then(()=>{musicOn=true;}).catch(()=>{}); }
tryPlay();
['click','touchstart','keydown'].forEach(evt => document.addEventListener(evt, function once(){ if(!musicOn) tryPlay(); }, {once:true}));

/* ===================== TYPEWRITER ===================== */
function typewrite(el, text, speed, done){
  el.textContent=''; let i=0;
  const t=setInterval(()=>{
    el.textContent += text[i++] || '';
    if(i>text.length){ clearInterval(t); done && done(); }
  }, speed);
}
function typeLines(el, lines, speed, done){
  el.innerHTML=''; let li=0;
  function nextLine(){
    if(li>=lines.length){ done && done(); return; }
    const p = document.createElement('div');
    el.appendChild(p);
    let i=0;
    const t=setInterval(()=>{
      p.textContent += lines[li][i++] || '';
      if(i>lines[li].length){ clearInterval(t); li++; setTimeout(nextLine, 260); }
    }, speed);
  }
  nextLine();
}
typeLines(document.getElementById('introText'), CONFIG.introLines, 30);

/* ===================== SCENE NAVIGATION ===================== */
const scenes = { 
  0:document.getElementById('scene0'), 
  1:document.getElementById('scene1'),
  2:document.getElementById('scene2'), 
  3:document.getElementById('scene3'),
  4:document.getElementById('scene4') 
};
const backBtn = document.getElementById('backBtn');
let currentScene = 0;

function showScene(n){
  currentScene = n;
  Object.values(scenes).forEach(s => s.classList.remove('active'));
  scenes[n].classList.add('active');
  backBtn.style.display = n === 0 ? 'none' : 'flex';

  if(n === 4){
    animateBirthdayScene();
  }
}
backBtn.addEventListener('click', ()=>{ if(currentScene > 0) showScene(currentScene - 1); });
showScene(0);

/* ===================== RESPONSIVE DODGY BUTTON ===================== */
function makeDodgy(btn){
  let isFixed = false;
  function dodge(){
    if(!isFixed){
      btn.style.position = 'fixed';
      isFixed = true;
    }
    const w = btn.offsetWidth || 100, h = btn.offsetHeight || 42;
    const pad = 16;
    const maxX = Math.max(pad, window.innerWidth - w - pad);
    const maxY = Math.max(pad, window.innerHeight - h - pad);
    btn.style.left = (pad + Math.random()*maxX) + 'px';
    btn.style.top  = (pad + Math.random()*maxY) + 'px';
  }
  btn.addEventListener('mouseenter', dodge);
  btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodge(); }, {passive:false});
  btn.addEventListener('click', (e)=>{ e.preventDefault(); dodge(); });
}
makeDodgy(document.getElementById('q1Dodgy'));
makeDodgy(document.getElementById('q2Dodgy'));

/* ===================== ANIMATED BIRTHDAY SCENE ===================== */
const rowHappy = document.getElementById('rowHappy');
const rowBirth = document.getElementById('rowBirth');
let bdayAnimated = false;

function buildWord(container, word, style){
  container.innerHTML='';
  [...word].forEach(ch=>{
    const span=document.createElement('span');
    span.className=style;
    span.textContent= ch===' ' ? '\u00A0' : ch;
    container.appendChild(span);
  });
}

function animateWord(container, placeHatOnY=false){
  const letters=[...container.children];
  letters.forEach((el,i)=>{
    setTimeout(()=>{
      el.style.transition="transform .55s cubic-bezier(.17,.67,.27,1.35), opacity .5s";
      el.style.transform="translateY(0)"; el.style.opacity=1;
      setTimeout(()=>el.style.transform="translateY(-6px)",520);
      setTimeout(()=>el.style.transform="translateY(0)",740);

      if(placeHatOnY && el.textContent.toLowerCase()==='y'){
        const hat=document.createElementNS("http://www.w3.org/2000/svg","svg");
        hat.setAttribute("viewBox","0 0 100 100"); hat.classList.add("hat");
        hat.innerHTML=`<defs>
            <linearGradient id="cone" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff9d68"/><stop offset="1" stop-color="#ff6f6a"/>
            </linearGradient>
            <filter id="hshadow"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".35"/></filter>
          </defs>
          <polygon points="50,6 92,92 8,92" fill="url(#cone)" stroke="#4a3427" stroke-width="6" filter="url(#hshadow)"/>
          <circle cx="92" cy="8" r="10" fill="#4a3427"/>`;
        el.style.position='relative'; el.appendChild(hat);
      }
    }, 110*i);
  });
}

function animateBirthdayScene(){
  if(bdayAnimated) return;
  bdayAnimated = true;

  buildWord(rowHappy, CONFIG.happy, 'tile');
  buildWord(rowBirth, CONFIG.birthday, 'coralText');

  const cake = document.createElement('span');
  cake.className = 'cake';
  cake.textContent = '🍰';
  rowBirth.appendChild(cake);

  animateWord(rowHappy, true);
  setTimeout(()=>animateWord(rowBirth, false), 110*CONFIG.happy.length + 200);
}

/* ===================== BUILD 12 MONTHS (CLICK-TO-REVEAL) ===================== */
const grid = document.getElementById('grid');
const colorClasses = ['c1','c2','c3','c4'];
let activeCard = null;

function buildBoard(){
  grid.innerHTML = '';
  CONFIG.twelveMonths.forEach((m, idx) => {
    const el = document.createElement('div');
    el.className = `monthCard ${colorClasses[idx % colorClasses.length]}`;
    el.innerHTML = `
      <div class="pin"></div>
      <div class="monthLabel">${m.month}</div>
      <div class="monthSubPrompt">tap to open 💌</div>
      <div class="monthDetails">
        <div class="monthHeading">${m.title}</div>
        <p class="monthBody">"${m.note.replace(/\n/g, '<br>')}"</p>
      </div>
    `;
    
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (el === activeCard) {
        el.classList.remove('opened');
        activeCard = null;
      } else {
        if (activeCard) {
          activeCard.classList.remove('opened');
        }
        el.classList.add('opened');
        activeCard = el;
      }
    });

    grid.appendChild(el);
  });
}

// Tap outside cards to close active card
document.addEventListener('click', (e) => {
  if (activeCard && !e.target.closest('.monthCard')) {
    activeCard.classList.remove('opened');
    activeCard = null;
  }
});

const letterModal = document.getElementById('letterModal');
const letterBtn = document.getElementById('letterBtn');
const letterClose = document.getElementById('letterClose');
let letterTyped = false;

    titleEl.textContent=''; bodyEl.textContent=''; signEl.textContent='';
    typewrite(titleEl, CONFIG.letterTitle, 30, ()=>{
      typewrite(bodyEl, CONFIG.letterBody, 12, ()=>{
        typewrite(signEl, CONFIG.signature, 36, ()=>{ letterTyped = true; });
      });
    });
  }
});
letterClose.addEventListener('click', ()=> letterModal.classList.remove('show'));
letterModal.addEventListener('click', e => { if(e.target===letterModal) letterModal.classList.remove('show'); });
