<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday Meghana</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fff2e3;
  --board:#f4e2c4;
  --board-d:#e9cf9f;
  --card:#fffaf1;
  --ink:#4a3427;
  --peach:#ff9d68;
  --peach-d:#e97f47;
  --lav:#c6a8ff;
  --lav-d:#a97ff0;
  --mint:#9adfc0;
  --mint-d:#6cc79c;
  --yellow:#ffe08a;
  --yellow-d:#f0c256;
  --coral:#ff6f6a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  font-family:'Nunito',system-ui;
  color:var(--ink);
  overflow-x:hidden;
}

.texture{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(var(--board-d) 1.4px, transparent 1.4px);
  background-size:26px 26px;
  opacity:.35;
}
.sparkle{
  position:fixed; pointer-events:none; font-size:22px; opacity:0;
  text-shadow:0 0 10px #fff8, 0 0 16px #ffd7; z-index:6;
}

/* ================= BACK BUTTON ================= */
.backBtn{
  position:fixed; top:16px; left:16px; z-index:20;
  width:42px; height:42px; border-radius:50%;
  background:#fff; border:3px solid var(--ink);
  display:none; align-items:center; justify-content:center;
  font-size:18px; font-weight:900; cursor:pointer;
  box-shadow:0 5px 0 #0002;
}

/* ================= GATE (intro + questions) ================= */
#gate{ transition:opacity .5s ease, visibility .5s ease; }
#gate.hide{ opacity:0; visibility:hidden; position:fixed; inset:0; pointer-events:none; }

.scene{
  position:fixed; inset:0; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:24px; padding:24px;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .45s ease;
}
.scene.active{ opacity:1; visibility:visible; pointer-events:auto; }

/* ---- Neon Intro ---- */
.scene-neon{ background:#1c1815; overflow:hidden; }
.introBg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center 70%;
}
.introScrim{
  position:absolute; inset:0;
  background:linear-gradient(180deg, #000000b0 0%, #00000040 38%, #00000090 100%);
}
.neon-content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:22px; }
.neon-text{
  font-family:'Great Vibes', cursive;
  font-size:clamp(28px, 5.6vw, 54px);
  line-height:1.3;
  color:#ffe9b8;
  text-shadow:
    0 0 6px #ffdf9a, 0 0 14px #ffcf6b, 0 0 26px #ffb84d, 0 0 46px #ff9f2e;
  max-width:820px;
}
.neon-sub{
  font-family:'Nunito'; font-weight:700; font-size:clamp(13px,2.1vw,16px);
  color:#f3dcb8; opacity:.9; letter-spacing:.4px;
}
.neon-heart{
  position:absolute; z-index:2; font-size:22px; color:#ffdb8a;
  text-shadow:0 0 10px #ffcf6b, 0 0 18px #ff9f2e;
  animation:twinkle 1.8s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{ opacity:.35; transform:scale(.9); }
  50%{ opacity:1; transform:scale(1.15); }
}

/* ---- Question Layout with Left/Right Reaction Pics ---- */
.scene-light{ background:var(--bg); }
.qWrapper{
  display:flex; align-items:center; justify-content:center;
  gap:20px; max-width:960px; width:100%;
}
.qSidePic{
  width:clamp(75px, 12vw, 130px);
  height:clamp(75px, 12vw, 130px);
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--ink);
  box-shadow:0 6px 0 #0002;
  flex-shrink:0;
}
.qSidePic.leftPic{ transform:rotate(-6deg); }
.qSidePic.rightPic{ transform:rotate(6deg); }

.qCenter{
  display:flex; flex-direction:column; align-items:center; gap:12px;
}
.scene-light .qTitle{
  font-family:'Baloo 2'; font-weight:800; font-size:clamp(22px,3.8vw,34px); color:var(--ink);
  max-width:550px;
}
.scene-light .qSub{
  font-family:'Caveat'; font-weight:700; font-size:clamp(20px,3vw,26px); color:var(--peach-d);
  max-width:550px; margin-bottom:-6px;
}

.btnRow{ display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-top:6px; }

.choiceBtn{
  font-family:'Baloo 2'; font-weight:800; font-size:17px;
  border:3px solid var(--ink); border-radius:999px;
  padding:14px 30px; cursor:pointer;
  box-shadow:0 7px 0 #0002; transition:transform .12s ease;
}
.choiceBtn:active{ transform:translateY(3px); }
.choiceBtn.good{ background:var(--mint); box-shadow:0 7px 0 #0002, inset 0 -4px 0 var(--mint-d); }
.choiceBtn.dodgy{ background:var(--coral); color:#fff; box-shadow:0 7px 0 #0002, inset 0 -4px 0 #c94d47; z-index:9; }

.nextBtn, .pillBtn{
  font-family:'Baloo 2'; font-weight:800; font-size:18px;
  background:var(--coral); color:#fff;
  border:3px solid var(--ink); border-radius:999px;
  padding:14px 32px; cursor:pointer;
  box-shadow:0 8px 0 #0002, inset 0 -5px 0 #c94d47;
  transition:transform .15s ease;
  display:inline-flex; align-items:center; gap:10px;
}
.nextBtn:active, .pillBtn:active{ transform:translateY(4px); }

/* ---- Scene 4: Hero Stage Layout (like Likhitha's) ---- */
.stage {
  position: relative;
  width: min(1050px, 94vw);
  display: flex;
  align-items: center;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 32px;
}
.stageLeft {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: flex-start;
  text-align: left;
}
.row {
  display: flex;
  gap: 6px;
  align-items: flex-end;
  flex-wrap: wrap;
}
.tile {
  display: grid;
  place-items: center;
  min-width: 52px;
  padding: 4px 12px;
  background: linear-gradient(#fff, #f6f8ff);
  border: 4px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 8px 0 #0002;
  font-size: clamp(34px, 5.5vw, 68px);
  line-height: 1;
  font-weight: 800;
  color: var(--ink);
  transform: translateY(40px);
  opacity: 0;
  letter-spacing: -0.02em;
}
.coralText {
  display: inline-block;
  font-size: clamp(34px, 5.5vw, 68px);
  font-weight: 800;
  color: var(--peach-d);
  -webkit-text-stroke: 2px var(--ink);
  filter: drop-shadow(0 6px 0 #0002);
  transform: translateY(40px);
  opacity: 0;
  letter-spacing: -0.03em;
}
.cake {
  display: inline-block;
  margin-left: .35rem;
  font-size: clamp(28px, 4vw, 44px);
  transform-origin: 50% 100%;
  animation: cakeWiggle 2.2s ease-in-out infinite;
}
@keyframes cakeWiggle {
  0%, 100% { transform: translateY(0) rotate(-6deg); }
  50% { transform: translateY(-4px) rotate(6deg); }
}

.hat {
  position: absolute;
  width: clamp(32px, 4.8vw, 56px);
  height: clamp(32px, 4.8vw, 56px);
  left: 58%;
  top: -24%;
  transform-origin: 30% 90%;
  animation: hatSlide 2.6s ease-in-out infinite;
}
@keyframes hatSlide {
  0%, 100% { transform: translateX(-6px) rotate(10deg); }
  50% { transform: translateX(4px) rotate(16deg); }
}

.stageRight {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.avatarWrap {
  width: clamp(220px, 30vw, 320px);
  height: clamp(220px, 30vw, 320px);
  border-radius: 50%;
  overflow: hidden;
  border: 7px solid var(--ink);
  box-shadow: 0 16px 36px #0002;
  transform: scale(.85);
  opacity: 0;
}
.avatarWrap img {
  width: 100%; height: 100%; object-fit: cover;
}
.nameTag {
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  padding: 9px 24px;
  border-radius: 999px;
  background: var(--yellow);
  color: var(--ink);
  border: 3px solid var(--ink);
  font-family: 'Nunito';
  font-weight: 900;
  font-size: 18px;
  box-shadow: 0 6px 0 #0002, inset 0 -4px 0 var(--yellow-d);
  opacity: 0;
}

/* ================= BOARD ================= */
.boardWrap{ position:relative; z-index:2; min-height:100vh; padding:100px 24px 60px; display:none; }
.boardWrap.show{display:block}

.boardHeader{ text-align:center; margin-bottom:30px; }
.boardHeader h1{ font-family:'Baloo 2'; font-size:clamp(24px,3.6vw,40px); margin:0; color:var(--ink); }
.boardSub{ text-align:center; }
.boardSub p{ font-family:'Caveat'; font-size:24px; margin:4px 0 0; color:var(--peach-d); }

.grid-notes{
  max-width:1100px; margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
  gap:26px 22px;
}
.note, .photo{
  position:relative; border-radius:8px; padding:20px 16px 16px;
  border:2px solid var(--ink); box-shadow:0 10px 18px #0002;
  font-family:'Nunito'; font-weight:700; font-size:16px; line-height:1.4;
  opacity:0; transform:translateY(40px) scale(.9);
  transition:opacity .5s ease, transform .5s cubic-bezier(.2,.7,.3,1.3);
  cursor:pointer; min-height:150px;
  display:flex; align-items:center; justify-content:center; text-align:center;
}
.grid-notes.animate .note, .grid-notes.animate .photo{opacity:1; transform:translateY(0) scale(1) rotate(var(--rot));}

.note.c1{background:var(--peach)}
.note.c2{background:var(--lav)}
.note.c3{background:var(--mint)}
.note.c4{background:var(--yellow)}

.pin{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%);
  width:16px; height:16px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff, var(--coral) 60%, #a83a35 100%);
  border:1px solid #0003; box-shadow:0 2px 3px #0004;
}
.photo{ background:var(--card); padding:10px 10px 34px; min-height:auto; }
.photo img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:4px; display:block; border:1px solid #0002; }
.photo figcaption{ font-family:'Caveat'; font-weight:700; font-size:19px; text-align:center; margin-top:8px; color:var(--peach-d); }
.tape{
  position:absolute; top:-8px; left:50%; transform:translateX(-50%) rotate(-3deg);
  width:70px; height:22px; background:#fff8; border:1px solid #0001; box-shadow:0 2px 4px #0002;
}

/* Floating Letter Button */
.floatBtn{
  position:fixed; top:18px; right:18px; z-index:5;
  font-family:'Baloo 2'; font-weight:700; font-size:14px;
  background:var(--coral); color:#fff;
  border:3px solid var(--ink); border-radius:999px;
  padding:10px 16px; cursor:pointer;
  box-shadow:0 5px 0 #0002, inset 0 -4px 0 #c94d47;
  display:none; align-items:center; gap:6px;
}
body.board-active .floatBtn{display:inline-flex}

/* Modals */
.modalBack{
  position:fixed; inset:0; background:#3a2b2380;
  display:none; align-items:center; justify-content:center; z-index:40; padding:20px;
}
.modalBack.show{display:flex}
.letterCard{
  width:min(640px,94vw); max-height:86vh; overflow-y:auto;
  background:var(--card); border:5px solid var(--ink); border-radius:20px;
  padding:30px 28px 26px; position:relative; box-shadow:0 20px 40px #0004;
}
.zoomCard{
  width:min(420px,90vw); background:var(--card); border:5px solid var(--ink); border-radius:20px;
  padding:26px; position:relative; text-align:center;
}
.zoomCard img{width:100%; border-radius:10px; margin-bottom:10px;}
.closeX{
  position:absolute; right:10px; top:10px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:2px solid var(--ink); display:grid; place-items:center;
  font-weight:900; cursor:pointer;
}
.letterCard h2{ font-family:'Baloo 2'; text-align:center; margin:0 0 14px; font-size:24px; }
.letterCard p{ font-family:'Caveat'; font-size:22px; line-height:1.55; white-space:pre-wrap; margin:0; }
.signature{ text-align:right; font-family:'Caveat'; font-size:26px; margin-top:16px; color:var(--peach-d); }
</style>
</head>
<body>

<div class="texture"></div>
<div id="sparkLayer"></div>
<button class="backBtn" id="backBtn">←</button>

<!-- ================= GATE ================= -->
<div id="gate">

  <!-- Scene 0: Neon Intro -->
  <div class="scene scene-neon active" id="scene0">
    <img class="introBg" src="intro-bg.jpeg" alt="">
    <div class="introScrim"></div>
    <div class="neon-heart" style="top:8%; left:8%;">♡</div>
    <div class="neon-heart" style="top:14%; right:10%; animation-delay:.4s;">✦</div>
    <div class="neon-heart" style="top:30%; left:14%; animation-delay:.8s;">✦</div>
    <div class="neon-heart" style="top:38%; right:16%; animation-delay:1.1s;">♡</div>
    <div class="neon-content">
      <div class="neon-text" id="introText"></div>
      <div class="neon-sub">tap next when you're ready</div>
      <button class="nextBtn" id="introNext">Next →</button>
    </div>
  </div>

  <!-- Scene 1: Q1 (Shy) -->
  <div class="scene scene-light" id="scene1">
    <div class="qWrapper">
      <img src="shy-left.jpg" class="qSidePic leftPic" alt="shy">
      <div class="qCenter">
        <div class="qTitle">Do you like me or hate me?</div>
        <div class="btnRow">
          <button class="choiceBtn good" id="q1Good">like me 🥰</button>
          <button class="choiceBtn dodgy" id="q1Dodgy">hate me 😤</button>
        </div>
      </div>
      <img src="shy-right.jpg" class="qSidePic rightPic" alt="shy">
    </div>
  </div>

  <!-- Scene 2: Q2 (More Shy) -->
  <div class="scene scene-light" id="scene2">
    <div class="qWrapper">
      <img src="more-shy-left.jpg" class="qSidePic leftPic" alt="more shy">
      <div class="qCenter">
        <div class="qSub">Ahhhhh dorikesav.. ippudu deeniki answer chey</div>
        <div class="qTitle">Do you love me or like me?</div>
        <div class="btnRow">
          <button class="choiceBtn good" id="q2Good">love me 🥹</button>
          <button class="choiceBtn dodgy" id="q2Dodgy">like me 😅</button>
        </div>
      </div>
      <img src="more-shy-right.jpg" class="qSidePic rightPic" alt="more shy">
    </div>
  </div>

  <!-- Scene 3: Joke (Laughing) -->
  <div class="scene scene-light" id="scene3">
    <div class="qWrapper">
      <img src="laugh-left.jpg" class="qSidePic leftPic" alt="laughing">
      <div class="qCenter">
        <div class="qTitle">Hahaha oorike anna le serious avvaku Meghana 😂</div>
        <button class="nextBtn" id="jokeNext" style="margin-top:10px;">Next →</button>
      </div>
      <img src="laugh-right.jpg" class="qSidePic rightPic" alt="laughing">
    </div>
  </div>

  <!-- Scene 4: Birthday Stage (Likhitha style layout, 1 single photo with Meghana underneath) -->
  <div class="scene scene-light" id="scene4">
    <div class="stage">
      <div class="stageLeft">
        <div class="row" id="rowHappy"></div>
        <div class="row" id="rowBirth"></div>
        <button class="pillBtn" id="openBoardBtn">💌 View Notes & Wall →</button>
      </div>
      <div class="stageRight">
        <div class="avatarWrap" id="avatarWrap">
          <img src="meghana.jpg" alt="Meghana">
        </div>
        <div class="nameTag" id="nameTag">Meghana ♥</div>
      </div>
    </div>
  </div>

</div>

<!-- BOARD -->
<div class="boardWrap" id="board">
  <div class="boardHeader">
    <h1>A wall full of you, Meghana ✨</h1>
  </div>
  <div class="boardSub"><p>tap a note or a photo to peek closer</p></div>
  <div class="grid-notes" id="grid"></div>
</div>

<button class="floatBtn" id="letterBtn">💌 Read My Letter</button>

<!-- ZOOM MODAL -->
<div class="modalBack" id="zoomModal">
  <div class="zoomCard" id="zoomCardInner"></div>
</div>

<!-- LETTER MODAL -->
<div class="modalBack" id="letterModal">
  <div class="letterCard">
    <button class="closeX" id="letterClose">✕</button>
    <h2 id="letterTitle"></h2>
    <p id="letterBody"></p>
    <div class="signature" id="letterSign"></div>
  </div>
</div>

<audio id="bgm" src="bgm.mp3" loop></audio>

<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  name: "Meghana",
  introLines: [
    "Eyy pandhi pilla.",
    "Enti ikkadiki ochav?",
    "Sarle elago ochav ga, kindha next button click chesi questions ki answer chey."
  ],
  happy: "Happy",
  birthday: "Birthday",
  photos: [
    { src: "pic1.jpg", caption: "the day that became a core memory" },
    { src: "pic2.jpg", caption: "us, unnecessarily dramatic as always" },
    { src: "pic3.jpg", caption: "certified partners in crime" },
    { src: "pic4.jpg", caption: "this smile > any bad day" },
  ],
  notes: [
    "You're the friend who replies to my 2am 'are you up' texts. every time.",
    "My personal free-of-cost complaint helpline. 24/7.",
    "Growing up would've been so boring without you around to mess it up.",
    "You laugh at your own jokes before you even finish them. I love that so much.",
    "Official title: my chaos-approved, government-certified best friend.",
    "No matter how long the gap between us, we pick up like it was yesterday.",
    "Loudest voice in the group chat. also the kindest one. lucky us.",
    "Every memory I actually love has you randomly showing up in it.",
    "Warning: hugging this human may cause sudden, uncontrollable happiness.",
    "Here's to more inside jokes literally nobody else will ever understand.",
  ],
  letterTitle: "To Meghana, on your birthday 💖",
  letterBody:
`Okay first of all — happy birthday, you absolute menace, I love you!

I don't know how to write this without either roasting you or getting way too soft, so I'm just going to do both.

You are genuinely one of the funniest, most comforting people I know, and somehow all of that makes you the best friend I could've asked for. Every random memory, every stupid inside joke, every "I'm never talking to you again" that lasted about four minutes — I wouldn't trade any of it.

Thank you for always being there, for making the worst days bearable, and for never once making me feel like I'm too much. Here's to more birthdays, more chaos, and many many more years of this ridiculous friendship.

I hope today makes you feel exactly as loved as you actually are.`,
  signature: "— always your bestie ✨",
  sparkleSet: ["✨","🌟","💫","🌸","🎀","💕","🧁","🎈"],
  sparklesPerSecond: 10
};

/* ===================== SPARKLES ===================== */
const sparkLayer = document.getElementById('sparkLayer');
function spawnSpark(){
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.textContent = CONFIG.sparkleSet[Math.floor(Math.random()*CONFIG.sparkleSet.length)];
  s.style.left = Math.random()*innerWidth + 'px';
  s.style.top = Math.random()*innerHeight + 'px';
  s.style.transform = `scale(${0.6+Math.random()*1.2}) rotate(${Math.random()*30-15}deg)`;
  sparkLayer.appendChild(s);
  requestAnimationFrame(()=> s.style.transition = 'opacity .2s ease');
  s.style.opacity = 1;
  setTimeout(()=> s.style.opacity = 0, 400 + Math.random()*500);
  setTimeout(()=> s.remove(), 1200);
}
for(let i=0;i<4;i++) spawnSpark();
setInterval(spawnSpark, 1000/CONFIG.sparklesPerSecond);

/* ===================== AUDIO ===================== */
const bgm = document.getElementById('bgm');
let musicOn = false;
function tryPlay(){ bgm.play().then(()=>{musicOn=true;}).catch(()=>{}); }
tryPlay();
['click','touchstart','keydown'].forEach(evt => document.addEventListener(evt, function once(){ if(!musicOn) tryPlay(); }, {once:true}));

/* ===================== TYPEWRITER ===================== */
function typewrite(el, text, speed, done){
  el.textContent=''; let i=0;
  const t=setInterval(()=>{
    el.textContent += text[i++] || '';
    if(i>text.length){ clearInterval(t); done && done(); }
  }, speed);
}
function typeLines(el, lines, speed, done){
  el.innerHTML=''; let li=0;
  function nextLine(){
    if(li>=lines.length){ done && done(); return; }
    const p = document.createElement('div');
    el.appendChild(p);
    let i=0;
    const t=setInterval(()=>{
      p.textContent += lines[li][i++] || '';
      if(i>lines[li].length){ clearInterval(t); li++; setTimeout(nextLine, 260); }
    }, speed);
  }
  nextLine();
}
typeLines(document.getElementById('introText'), CONFIG.introLines, 30);

/* ===================== SCENE NAVIGATION ===================== */
const scenes = { 
  0:document.getElementById('scene0'), 
  1:document.getElementById('scene1'),
  2:document.getElementById('scene2'), 
  3:document.getElementById('scene3'),
  4:document.getElementById('scene4') 
};
const backBtn = document.getElementById('backBtn');
let currentScene = 0;

function showScene(n){
  currentScene = n;
  Object.values(scenes).forEach(s => s.classList.remove('active'));
  scenes[n].classList.add('active');
  backBtn.style.display = n === 0 ? 'none' : 'flex';

  if(n === 4){
    animateBirthdayScene();
  }
}
backBtn.addEventListener('click', ()=>{ if(currentScene > 0) showScene(currentScene - 1); });
showScene(0);

/* ===================== DODGY BUTTON ===================== */
function makeDodgy(btn){
  btn.style.position = 'fixed';
  function dodge(){
    const w = btn.offsetWidth || 120, h = btn.offsetHeight || 45;
    const maxX = Math.max(20, window.innerWidth - w - 20);
    const maxY = Math.max(20, window.innerHeight - h - 20);
    btn.style.left = (20 + Math.random()*maxX) + 'px';
    btn.style.top  = (20 + Math.random()*maxY) + 'px';
  }
  function nearPointer(px, py){
    const r = btn.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if (Math.hypot(px-cx, py-cy) < 120) dodge();
  }
  document.addEventListener('mousemove', e => nearPointer(e.clientX, e.clientY));
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (t) nearPointer(t.clientX, t.clientY);
  }, { passive:true });
  btn.addEventListener('click', e => { e.preventDefault(); dodge(); });
}

/* ===================== ANIMATED BIRTHDAY SCENE ===================== */
const rowHappy = document.getElementById('rowHappy');
const rowBirth = document.getElementById('rowBirth');
const avatarWrap = document.getElementById('avatarWrap');
const nameTag = document.getElementById('nameTag');
let bdayAnimated = false;

function buildWord(container, word, style){
  container.innerHTML='';
  [...word].forEach(ch=>{
    const span=document.createElement('span');
    span.className=style;
    span.textContent= ch===' ' ? '\u00A0' : ch;
    container.appendChild(span);
  });
}

function animateWord(container, placeHatOnY=false){
  const letters=[...container.children];
  letters.forEach((el,i)=>{
    setTimeout(()=>{
      el.style.transition="transform .55s cubic-bezier(.17,.67,.27,1.35), opacity .5s";
      el.style.transform="translateY(0)"; el.style.opacity=1;
      setTimeout(()=>el.style.transform="translateY(-6px)",520);
      setTimeout(()=>el.style.transform="translateY(0)",740);

      if(placeHatOnY && el.textContent.toLowerCase()==='y'){
        const hat=document.createElementNS("http://www.w3.org/2000/svg","svg");
        hat.setAttribute("viewBox","0 0 100 100"); hat.classList.add("hat");
        hat.innerHTML=`<defs>
            <linearGradient id="cone" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff9d68"/><stop offset="1" stop-color="#ff6f6a"/>
            </linearGradient>
            <filter id="hshadow"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".35"/></filter>
          </defs>
          <polygon points="50,6 92,92 8,92" fill="url(#cone)" stroke="#4a3427" stroke-width="6" filter="url(#hshadow)"/>
          <circle cx="92" cy="8" r="10" fill="#4a3427"/>`;
        el.style.position='relative'; el.appendChild(hat);
      }
    }, 110*i);
  });
}

function animateBirthdayScene(){
  if(bdayAnimated) return;
  bdayAnimated = true;

  buildWord(rowHappy, CONFIG.happy, 'tile');
  buildWord(rowBirth, CONFIG.birthday, 'coralText');

  const cake = document.createElement('span');
  cake.className = 'cake';
  cake.textContent = '🍰';
  rowBirth.appendChild(cake);

  animateWord(rowHappy, true);
  setTimeout(()=>animateWord(rowBirth, false), 110*CONFIG.happy.length + 200);

  setTimeout(()=>{
    avatarWrap.style.transition="transform 1s cubic-bezier(.2,.8,.3,1.2), opacity .8s ease";
    nameTag.style.transition="opacity .8s ease .2s";
    avatarWrap.style.transform="scale(1)"; avatarWrap.style.opacity=1; nameTag.style.opacity=1;
  }, 110*(CONFIG.happy.length+CONFIG.birthday.length) + 500);
}

/* ===================== BUILD BOARD ===================== */
const grid = document.getElementById('grid');
const rotations = [-4,3,-2,5,-5,2,-3,4,-2,3,-4,5,2,-3];
function buildBoard(){
  grid.innerHTML = '';
  const items = [];
  CONFIG.notes.forEach(n => items.push({type:'note', text:n}));
  CONFIG.photos.forEach(p => items.push({type:'photo', src:p.src, caption:p.caption}));
  
  for(let i=items.length-1;i>0;i--){
    const j = (i * 7 + 3) % (i+1);
    [items[i], items[j]] = [items[j], items[i]];
  }
  const colorClasses = ['c1','c2','c3','c4'];
  items.forEach((item, idx) => {
    const rot = rotations[idx % rotations.length];
    let el;
    if(item.type === 'note'){
      el = document.createElement('div');
      el.className = 'note ' + colorClasses[idx % colorClasses.length];
      el.style.setProperty('--rot', rot+'deg');
      el.innerHTML = `<div class="pin"></div>${item.text}`;
      el.addEventListener('click', ()=> openZoomNote(item.text));
    } else {
      el = document.createElement('figure');
      el.className = 'photo';
      el.style.setProperty('--rot', rot+'deg');
      el.innerHTML = `<div class="tape"></div><img src="${item.src}" alt="${item.caption}"><figcaption>${item.caption}</figcaption>`;
      el.addEventListener('click', ()=> openZoomPhoto(item.src, item.caption));
    }
    grid.appendChild(el);
  });
  requestAnimationFrame(()=> setTimeout(()=> grid.classList.add('animate'), 60));
}

  zoomModal.classList.add('show');
  document.getElementById('zoomClose2').addEventListener('click', ()=> zoomModal.classList.remove('show'));
}
